<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./signpu.css" />
  </head>
  <body>
    <div class="form-holder">
      <form action="">
        <h2 style="text-align: center">SIGNUP PAGE</h2>
        <div class="form-items">
          <label for="">Username : </label>
          <input type="text" placeholder="username" />
        </div>

        <div class="form-items">
          <label for="">Password :</label>
          <input type="text" placeholder="password" />
        </div>

        <div class="form-items">
          <label for="">Email :</label>
          <input type="text" placeholder="email" />
        </div>

        <div class="form-items">
          <label for="">Phone :</label>
          <input type="text" placeholder="phone" />
        </div>

        <div class="form-items" id="gender">
          <div>
            <span>MALE</span>
            <input type="radio" />
          </div>
          <div>
            <span>FEMALE</span>
            <input type="radio" />
          </div>
        </div>

        <div class="form-items">
          <button onclick="alert('Sucessfully Signed-Up')">
            <a href="login.html">SIGNUP </a>
          </button>
          <button>CANCEL</button>
        </div>

        <a href="login.htm">ALREADY HAVE AN ACCOUNT?</a>
      </form>
    </div>
  </body>
</html>
